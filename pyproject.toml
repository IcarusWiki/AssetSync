[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assetsync"
version = "0.1.0"
description = "Keep icarus.wiki.gg game images in sync with the game's Assets/2DArt/UI textures."
requires-python = ">=3.12"
dependencies = [
    "pyuepak==0.2.8",
    "cryptography>=46",
    "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
assetsync = "assetsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Copied from IcarusWiki/Data; kept close to upstream rather than restyled.
extend-exclude = ["src/assetsync/wiki.py"]
