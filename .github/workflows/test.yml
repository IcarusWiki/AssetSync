name: Test

on:
  push:
    paths: ["src/**", "tests/**", "pyproject.toml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
